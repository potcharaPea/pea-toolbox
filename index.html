<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEA ToolBox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2374045F'/%3E%3Cpath d='M13 3 5 14h6l-1 7 8-11h-6z' fill='%23ffd23a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pea:#74045F; --pea2:#A2187F; --pea-soft:#f6edf4; --ink:#2b1328; --mute:#76637a;
  --line:#ecdfe9; --bg:#fff; --card:#fff; --ok:#16855a; --warn:#c07a00; --bad:#c62839;
  --r:20px; --shadow:0 10px 30px -12px rgba(116,4,95,.25); --gold:#f5b700;
}
*{box-sizing:border-box}
body{margin:0;font-family:Prompt,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 500px at 0% 45%,#fbeff8 0,transparent 60%),radial-gradient(800px 500px at 100% 80%,#fff6df 0,transparent 60%),#fff}
button,input,select{font:inherit;color:inherit}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;padding:36px 16px 130px;isolation:isolate;
  background:linear-gradient(140deg,#8a0a72 0%,var(--pea) 40%,#3a0233 100%)}
.hero::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(420px circle at var(--mx,70%) var(--my,30%),rgba(255,255,255,.14),transparent 60%)}
.aurora{position:absolute;inset:-20%;z-index:-1;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 16s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:520px;height:520px;left:55%;top:-10%;background:#ff3fb4}
.aurora i:nth-child(2){width:420px;height:420px;left:5%;top:40%;background:#7b2ff7;animation-duration:20s}
.aurora i:nth-child(3){width:360px;height:360px;left:75%;top:55%;background:var(--gold);opacity:.35;animation-duration:24s}
@keyframes drift{to{translate:-12% 10%;scale:1.15}}
.gridbg{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 70% 30%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 70% 30%,#000 10%,transparent 70%)}
.sparks{position:absolute;inset:0;z-index:0;pointer-events:none}
.sparks i{position:absolute;bottom:-10px;width:calc(4px*var(--s));height:calc(4px*var(--s));border-radius:50%;background:#ffe27a;
  box-shadow:0 0 10px 2px rgba(255,210,58,.8);animation:float-up linear infinite}
@keyframes float-up{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-480px) translateX(30px);opacity:0}}
.hero-inner{max-width:1080px;margin:0 auto;position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:24px}
.hero-text{flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.3px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#ffe27a,var(--gold));box-shadow:0 0 0 4px rgba(255,210,58,.18),0 8px 24px -6px rgba(255,190,0,.8)}
.logo svg{width:22px;height:22px}
.badge{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
.hero h1{font-size:clamp(32px,6.4vw,58px);line-height:1.12;margin:26px 0 10px;font-weight:700;letter-spacing:-.5px}
.grad{background:linear-gradient(90deg,#ffe27a,#ffb3e6,#fff,#ffe27a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:300% 0}}
.hero p{margin:0 0 26px;opacity:.85;font-weight:300;font-size:clamp(15px,2.4vw,18px)}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 10px 8px 20px;max-width:540px;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.45);transition:box-shadow .3s}
.search:focus-within{box-shadow:0 0 0 5px rgba(255,210,58,.35),0 18px 40px -12px rgba(0,0,0,.45)}
.search svg{width:20px;height:20px;color:var(--mute);flex:none}
.search input{flex:1;border:0;outline:0;padding:10px 0;background:none;min-width:0;color:var(--ink)}
.search kbd{font:12px Prompt,sans-serif;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.stat{padding:10px 16px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;min-width:92px}
.stat b{font-size:24px;font-weight:700;line-height:1.1;color:#ffe9a6}
.stat span{font-size:12px;opacity:.8}
.pole{width:340px;flex:none;overflow:visible;animation:hover-y 6s ease-in-out infinite;filter:drop-shadow(0 24px 40px rgba(0,0,0,.3))}
@keyframes hover-y{50%{translate:0 -10px}}
.pole .w{fill:none;stroke:rgba(255,255,255,.5);stroke-width:2}
.pole .pulse{fill:none;stroke:#ffd23a;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:16 260;animation:pulse 2.4s linear infinite;filter:drop-shadow(0 0 6px #ffd23a)}
.pole .pulse:nth-of-type(2n){animation-delay:-1.2s}
@keyframes pulse{from{stroke-dashoffset:276}to{stroke-dashoffset:0}}
.pole .orbit{fill:none;stroke:rgba(255,255,255,.16);stroke-dasharray:3 9;transform-origin:160px 170px;animation:spin 40s linear infinite}
.pole .orbit.o2{animation-direction:reverse;animation-duration:28s}
@keyframes spin{to{rotate:360deg}}
.pole .halo{transform-origin:160px 175px;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{scale:1.15;opacity:.7}}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:70px;z-index:1}
@media (max-width:760px){
  .pole{position:absolute;right:-70px;top:-10px;width:230px;opacity:.28;z-index:-1}
  .stat{min-width:0;padding:8px 12px}.stat b{font-size:20px}
}
@media (pointer:coarse){.search kbd{display:none}}
@media (max-width:520px){ /* มือถือ: การ์ด 2 คอลัมน์ ไม่ต้องเลื่อนยาว */
  main .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid .card{padding:14px;gap:6px}
  .grid .ico{width:42px;height:42px;border-radius:13px}.grid .ico svg{width:21px;height:21px}
  .grid .card b{font-size:14px;line-height:1.35}
  .grid .card small{font-size:12px}
  .grid .card .thumb{width:calc(100% + 28px);margin:-14px -14px 4px}
  .grid .tag{font-size:10px;padding:2px 8px}
  .grid .star{width:30px;height:30px;font-size:18px;top:6px;right:6px}
}
.wires{position:absolute;inset:auto 0 30px 0;height:150px;opacity:.4;z-index:0}
.wires path{fill:none;stroke:#fff;stroke-width:1.4;stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
.wires path:nth-child(2){animation-duration:3.1s;opacity:.7}
.wires path:nth-child(3){animation-duration:3.8s;opacity:.5}
.spark{fill:#ffe27a;filter:drop-shadow(0 0 6px #ffd23a)}
@keyframes flow{to{stroke-dashoffset:-160}}

/* ---------- content ---------- */
main{max-width:1080px;margin:-70px auto 0;padding:0 16px 60px;position:relative;z-index:2}
.tabs{position:sticky;top:10px;z-index:5;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px;border-radius:999px;width:max-content;max-width:100%;
  background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 14px 34px -14px rgba(116,4,95,.45)}
.tab{border:0;background:none;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--mute);transition:.25s;white-space:nowrap;flex:none}
.tab:hover{color:var(--pea)}
.tab[aria-selected=true]{background:linear-gradient(135deg,var(--pea2),var(--pea));color:#fff;box-shadow:0 6px 16px -6px rgba(162,24,127,.7)}
h2.sec{font-size:clamp(18px,3vw,22px);color:var(--ink);font-weight:700;margin:40px 4px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2.sec::before{content:"";width:6px;height:24px;border-radius:6px;background:linear-gradient(var(--gold),var(--pea2))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{all:unset;box-sizing:border-box;cursor:pointer;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;overflow:hidden;
  border:1px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,var(--line),var(--line)) border-box;
  box-shadow:0 4px 14px -8px rgba(116,4,95,.18);
  opacity:0;translate:0 18px;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(min(var(--i),24)*55ms);
  transition:transform .25s ease-out,box-shadow .3s}
.card:hover,.card:focus-visible{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px);
  background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,var(--pea2),var(--gold)) border-box;
  box-shadow:0 24px 44px -20px rgba(116,4,95,.5)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 48%,transparent 62%);translate:-130% 0;transition:translate .9s}
.card:hover::after{translate:130% 0}
.card:focus-visible{outline:2px solid var(--pea);outline-offset:2px}
@keyframes rise{to{opacity:1;translate:0 0}}
.ico{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--pea-soft);color:var(--pea);transition:transform .35s}
.card[data-kind=calc] .ico{background:linear-gradient(135deg,#c2309c,var(--pea));color:#fff;box-shadow:0 10px 22px -8px rgba(162,24,127,.65)}
.card[data-kind=std] .ico{background:linear-gradient(135deg,#fff3d1,#ffe09a);color:#8a5d00}
.card[data-kind^=goto]{background:linear-gradient(150deg,#fff 40%,#fdf2fa) padding-box,linear-gradient(135deg,var(--line),var(--line)) border-box}
.card[data-kind^=goto]:hover{background:linear-gradient(150deg,#fff 40%,#fdf2fa) padding-box,linear-gradient(135deg,var(--pea2),var(--gold)) border-box}
.card:hover .ico{transform:rotate(-8deg) scale(1.1)}
.ico svg{width:24px;height:24px}
.card b{font-weight:600;font-size:16px}
.card small{color:var(--mute);font-size:13px;line-height:1.5}
.thumb{display:block;width:calc(100% + 36px);margin:-18px -18px 4px;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r) var(--r) 0 0;background:var(--pea-soft);transition:transform .4s}
.card:hover .thumb{transform:scale(1.03)}
.card:has(.thumb){overflow:hidden}
.grid.mini{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid.mini .card{padding:12px;gap:4px}
.grid.mini .thumb{width:calc(100% + 24px);margin:-12px -12px 6px}
.grid.mini b{font-size:14px}
.grid.mini small{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:20px 0 0;padding-bottom:4px}
.subtabs .tab{background:#fff;border:1px solid var(--line);font-size:14px;padding:7px 14px}
.subtabs .tab[aria-selected=true]{background:var(--pea);border-color:var(--pea);color:#fff}
.subtabs .tab small{opacity:.7;margin-left:4px}
h3.grp{font-size:14px;font-weight:600;color:var(--pea);margin:18px 4px 8px}
h2.sec small{font-size:12px;font-weight:400}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.doc{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-decoration:none;
  box-shadow:0 4px 12px -8px rgba(116,4,95,.2);opacity:0;translate:0 18px;animation:rise .45s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(min(var(--i),20)*30ms);transition:border-color .2s,transform .2s}
.doc:hover,.doc:focus-visible{border-color:var(--pea);transform:translateX(4px)}
.doc svg{width:20px;height:20px;color:var(--pea);flex:none}
.doc span{flex:1;font-size:14px;line-height:1.4}
.doc small{color:var(--mute);font-size:12px;white-space:nowrap}
@media (max-width:400px){.docs{grid-template-columns:1fr}}
.card{position:relative}
.star{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;
  font-size:22px;line-height:1;color:#d9cdd7;cursor:pointer;transition:color .2s,transform .2s,background .2s}
.star:hover{background:#fff6dc;color:#e8a600;transform:scale(1.15)}
.star.on{color:#e8a600;filter:drop-shadow(0 1px 3px rgba(232,166,0,.5))}
.star.pop{animation:star-pop .45s cubic-bezier(.2,.9,.3,1.6)}
@keyframes star-pop{40%{transform:scale(1.6) rotate(15deg)}}
.still .card,.still .doc{animation:none;opacity:1;translate:none}
.star-toggle{border:1.5px solid #e8a600;background:#fff;color:#9a6a00;border-radius:999px;padding:7px 16px;cursor:pointer;font-size:14px;margin-bottom:14px;transition:.2s}
.star-toggle[aria-pressed=true]{background:linear-gradient(135deg,#ffe27a,var(--gold));border-color:var(--gold);color:#4a2f00}
.big-star{color:#e8a600;font-size:26px;line-height:1}
.tag{font-size:11px;color:var(--pea);background:var(--pea-soft);border-radius:999px;padding:2px 10px;align-self:flex-start}
.empty{color:var(--mute);padding:30px 4px}

/* ---------- dialog ---------- */
dialog{border:0;padding:0;border-radius:24px;width:min(640px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 30px 80px -20px rgba(43,19,40,.5)}
dialog::backdrop{background:rgba(43,19,40,.45);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}}
.dhead{position:sticky;top:0;background:linear-gradient(135deg,var(--pea),var(--pea2));color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px;z-index:1}
.dhead h3{margin:0;font-size:18px;font-weight:600;flex:1}
.x{border:0;background:rgba(255,255,255,.18);color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1}
.dbody{padding:20px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
label.f input,label.f select{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:0;transition:border-color .2s;width:100%}
label.f input:focus,label.f select:focus{border-color:var(--pea)}
.result{margin-top:18px;background:var(--pea-soft);border-radius:16px;padding:16px}
.big{font-size:34px;font-weight:700;color:var(--pea);line-height:1.1}
.big small{font-size:15px;font-weight:500;color:var(--mute)}
.rows{display:grid;gap:6px;margin-top:10px;font-size:14px}
.rows div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #e2cfdd;padding-bottom:6px}
.note{font-size:12px;color:var(--mute);margin-top:14px;line-height:1.6}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:500;color:#fff}
.bars{display:flex;gap:18px;align-items:flex-end;height:140px;margin:14px 0 4px;padding:0 6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:13px}
.bar i{display:block;width:100%;max-width:70px;border-radius:10px 10px 4px 4px;background:linear-gradient(var(--pea2),var(--pea));transition:height .6s cubic-bezier(.2,.8,.2,1);min-height:4px}
.bar i.max{background:linear-gradient(#e2566c,var(--bad))}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:12px}
tr.hl td{background:#fbe9f6;color:var(--pea);font-weight:600}
ul.pts{margin:0;padding-left:20px;line-height:1.8}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center;font-size:12px;color:var(--mute)}
.chip{border:1.5px solid var(--pea);background:#fff;color:var(--pea);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.chip:hover{background:var(--pea);color:#fff}
.chip svg{width:15px;height:15px}
#lb{width:min(1000px,calc(100% - 16px));background:#1d0c1b}
#lb .dbody{padding:0;overflow:auto;max-height:calc(100vh - 90px);text-align:center}
#lbimg{display:block;width:100%;height:auto;cursor:zoom-in;background:#fff}
#lbimg.zoom{width:220%;max-width:none;cursor:zoom-out}
#lbmsg{color:#f3dcec;padding:50px 20px}
footer{text-align:center;color:rgba(255,255,255,.75);font-size:13px;padding:56px 16px 40px;margin-top:30px;
  background:radial-gradient(600px 200px at 50% 0,rgba(255,63,180,.35),transparent 70%),linear-gradient(140deg,var(--pea),#2e0229)}
footer::before{content:"⚡ PEA ToolBox";display:block;color:#fff;font-size:18px;font-weight:600;margin-bottom:6px}

/* ---------- dialog: ตกแต่งเพิ่ม ---------- */
.dhead{background:linear-gradient(120deg,#c2309c,var(--pea),#4a0340,#c2309c);background-size:300% 100%;animation:shimmer 10s linear infinite}
.dhead::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(300px 80px at 85% 0,rgba(255,210,58,.35),transparent 70%)}
.dhead h3,.dhead .x{position:relative;z-index:1}
.x:focus{outline:none}.x:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- เครดิตผู้พัฒนา ---------- */
.dev-btn{cursor:pointer;color:#fff;font:inherit;font-size:12px;transition:background .2s,transform .2s}
.dev-btn:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
.foot-dev{margin-top:14px;padding:6px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1)}
#cr{width:min(420px,calc(100% - 32px));background:transparent;box-shadow:none;overflow:visible}
#cr::backdrop{background:rgba(30,6,28,.7);backdrop-filter:blur(6px)}
.cr-card{position:relative;overflow:hidden;text-align:center;color:#fff;padding:44px 24px 30px;border-radius:28px;
  background:radial-gradient(400px 200px at 50% 0,rgba(255,63,180,.55),transparent 70%),linear-gradient(160deg,#8a0a72,var(--pea) 45%,#2e0229);
  box-shadow:0 40px 90px -20px rgba(116,4,95,.8),inset 0 0 0 1px rgba(255,255,255,.15)}
.cr-card .x{position:absolute;top:14px;right:14px;z-index:2}
.cr-logo{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;
  background:linear-gradient(135deg,#ffe27a,var(--gold));box-shadow:0 0 0 8px rgba(255,210,58,.15),0 14px 40px -6px rgba(255,190,0,.9);
  animation:cr-logo .9s cubic-bezier(.2,1.4,.4,1) both}
.cr-logo svg{width:46px;height:46px}
@keyframes cr-logo{from{opacity:0;transform:scale(.2) rotate(-200deg)}}
.cr-k{margin:0;font-size:14px;letter-spacing:3px;opacity:.8;animation:cr-up .5s .45s both}
#crname{margin:8px 0 6px;font-size:clamp(28px,8vw,36px);font-weight:700;line-height:1.3;min-height:1.3em}
#crname span{display:inline-block;opacity:0;animation:cr-letter .55s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:calc(.7s + var(--d)*60ms);
  background:linear-gradient(180deg,#fff,#ffe9a6);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes cr-letter{from{opacity:0;transform:translateY(28px) scale(.3) rotate(-18deg)}to{opacity:1;transform:none}}
.cr-pos{display:inline-block;margin:6px 0 0;padding:6px 16px;border-radius:999px;font-weight:600;color:#4a2f00;
  background:linear-gradient(135deg,#ffe27a,var(--gold));animation:cr-up .6s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--pd,1.8s)}
.cr-app{margin:20px 0 0;font-size:12px;opacity:.65;animation:cr-up .5s both;animation-delay:calc(var(--pd,1.8s) + .3s)}

<script id="calc">
// อัตราบ้านอยู่อาศัย กฟภ. [จำนวนหน่วยในขั้น, บาท/หน่วย]
const TARIFF = {
  '1.1.1': { service: 8.19,  steps: [[15,2.3488],[10,2.9882],[10,3.2405],[65,3.6237],[50,3.7171],[250,4.2218],[Infinity,4.4217]] },
  '1.1.2': { service: 24.62, steps: [[150,3.2484],[250,4.2218],[Infinity,4.4217]] },
};
// Assy. No. 9706 — ค่าสูงสุดของความต้านทานจำเพาะดิน (โอห์ม-เมตร) ตามค่าความต้านทานดินที่ต้องการ
const GROUND = [
  {type:'GR-1',5:17, 10:34, 25:85},  {type:'GR-2',5:39, 10:79, 25:198},
  {type:'GR-3',5:57, 10:114,25:285}, {type:'GR-4',5:74, 10:147,25:368},
  {type:'GR-5',5:86, 10:174,25:436}, {type:'GS',  5:130,10:262,25:655},
  {type:'GC',  5:309,10:622,25:1555},
];
const calc = {
  bill(units, type, ft) {
    const t = TARIFF[type]; let left = units, energy = 0;
    for (const [n, rate] of t.steps) { const u = Math.min(left, n); energy += u * rate; left -= u; if (left <= 0) break; }
    const ftCost = units * ft, base = energy + t.service + ftCost, vat = base * 0.07;
    return { energy, service: t.service, ftCost, vat, total: base + vat };
  },
  unbalance(a, b, c) {
    const avg = (a + b + c) / 3;
    const dev = Math.max(Math.abs(a - avg), Math.abs(b - avg), Math.abs(c - avg));
    // กระแสนิวทรัลแบบเวกเตอร์ (สมมติ PF ทั้ง 3 เฟสเท่ากัน)
    const inN = Math.sqrt(Math.max(0, a*a + b*b + c*c - a*b - b*c - c*a));
    return { avg, pct: avg ? dev / avg * 100 : 0, inN };
  },
  trCurrent: (kva, volt) => kva * 1000 / (Math.sqrt(3) * volt),
  cableKg: (m, kgPer100) => m * kgPer100 / 100,
  cableM: (kg, kgPer100) => kg * 100 / kgPer100,
  // ponytail: สมมติกราวด์เดิมเป็น GR-1 (สัมประสิทธิ์ 0.381) ตามตัวอย่างในคู่มือ
  ground(rBefore, target) {
    const rho = rBefore / 0.381;
    const row = GROUND.find(g => rho <= g[target]);
    return { rho, type: row ? row.type : null };
  },
};
</script>

function toggleStar(s) {
  if (!myStars) myStars = new Set(STANDARDS.filter(x => x.star).map(x => x.title));
  myStars.has(s.title) ? myStars.delete(s.title) : myStars.add(s.title);
  try { localStorage.setItem('pea-stars', JSON.stringify([...myStars])); } catch {}
}

const $ = s => document.querySelector(s);
const fmt = (n, d = 2) => Number.isFinite(n) ? n.toLocaleString('th-TH', {minimumFractionDigits:d, maximumFractionDigits:d}) : '–';
const num = id => parseFloat($('#' + id).value) || 0;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function countTo(el, to, d = 2) { // ตัวเลขวิ่ง
  const from = parseFloat(el.dataset.v || 0); el.dataset.v = to;
  if (reduceMotion || !Number.isFinite(to)) { el.textContent = fmt(to, d); return; }
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / 400), e = 1 - (1 - k) ** 3;
    el.textContent = fmt(from + (to - from) * e, d); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

const assyChips = (ref, imgs = []) => {
  const nos = String(ref || '').match(/\b\d{4}[A-Z]?\b/g) || [];
  return `<div class="chips">อ้างอิง ${esc(ref)} ${nos.map(n => `<button class="chip" data-assy="${n}">${icon('img')}ดูแบบ ${n}</button>`).join('')}${

};
function openImg(title, file) {
  const img = $('#lbimg');
  $('#lbt').textContent = title;
  img.hidden = false; $('#lbmsg').hidden = true; img.classList.remove('zoom');
  img.onerror = () => { img.hidden = true; $('#lbmsg').hidden = false; };
  img.src = IMG_BASE + file;

}

// ===== หน้าแรก =====
let cat = 'all', hg = 'all', sg = 'all', dc = 'all'; // กลุ่มที่เลือก: หัวเสา / มาตรฐาน / หมวดเอกสาร
// แถวปุ่มกรองกลุ่ม · attr = ชื่อ data-attribute, count(g) = จำนวนในกลุ่ม
const subtabs = (attr, groups, sel, count, total) => `<div class="subtabs">${['all', ...groups].map(g =>
  `<button class="tab" data-${attr}="${g}" aria-selected="${g === sel}">${g === 'all' ? 'ทั้งหมด' : g}<small>${g === 'all' ? total : count(g)}</small></button>`).join('')}</div>`;
const summary = (i, kind, ico, title, sub, extra = '') => `<button class="card" style="--i:${i}" data-kind="${kind}" ${extra}>
  ${ico}<b>${title}</b><small>${sub}</small><span class="tag">ดูทั้งหมด →</span></button>`;
function render(still) { // still === true: วาดใหม่โดยไม่เล่น animation การ์ด (ใช้ตอนกดดาว)
  $('#list').classList.toggle('still', still === true);
  const q = $('#q').value.trim().toLowerCase();
  const hit = t => !q || ((t.title || t.code) + t.desc + (t.g || '') + (t.grp || '') + (t.grp && isStar(t) ? 'ติดดาว เจอบ่อย ใช้บ่อย' : '') + (t.kw || '') + (t.points || []).join(' ')).toLowerCase().includes(q);
  const card = (t, i, kind, id) => `<button class="card" style="--i:${i}" data-kind="${kind}" data-id="${id}">
      ${kind === 'std' ? `<span class="star${isStar(t) ? ' on' : ''}" data-star="${id}" role="button" tabindex="0" aria-pressed="${isStar(t)}"
        aria-label="${isStar(t) ? 'เอาดาวออก' : 'ติดดาว'}" title="${isStar(t) ? 'เอาดาวออก' : 'ติดดาว'}">★</span>` : ''}<span class="ico">${icon(kind === 'calc' ? t.icon : 'book')}</span><b>${esc(t.title)}</b><small>${esc(t.desc)}</small>
      ${kind === 'std' ? `<span class="tag">${esc(t.ref)}</span>` : ''}</button>`;
  const show = c => q || cat === 'all' || cat === c; // มีคำค้น = ค้นทุกหมวด
  const calcs = show('calc') ? TOOLS.filter(hit) : [];
  const stds = show('std') ? STANDARDS.map((s, j) => [s, j]).filter(([s]) => hit(s)) : [];
  const heads = show('head') ? HEADS.map((h, j) => [h, j]).filter(([h]) => hit(h)) : [];
  let i = 0, html = '';
  if (calcs.length) html += `<h2 class="sec">เครื่องคำนวณ</h2><div class="grid">${calcs.map(t => card(t, i++, 'calc', t.id)).join('')}</div>`;
  if (cat === 'all' && !q) { // หน้ารวม: มาตรฐานย่อเหลือการ์ดต่อกลุ่ม
    html += `<h2 class="sec">มาตรฐานก่อสร้าง</h2><div class="grid">${[STAR, ...STD_GROUPS].map(g =>
      summary(i++, 'goto-std', `<span class="ico">${g === STAR ? '<span class="big-star">★</span>' : icon('book')}</span>`,
        g === STAR ? 'มาตรฐานที่ติดดาว' : 'มาตรฐาน' + g, STANDARDS.filter(s => inGroup(s, g)).length + ' หัวข้อ', `data-g="${g}"`)).join('')}</div>`;
  } else if (stds.length) {
    html += `<h2 class="sec">มาตรฐานก่อสร้าง</h2>`;
    if (cat === 'std' && !q) html += subtabs('sg', [STAR, ...STD_GROUPS], sg, g => STANDARDS.filter(s => inGroup(s, g)).length, STANDARDS.length);
    const shown = cat === 'std' && !q && sg !== 'all' ? stds.filter(([s]) => inGroup(s, sg)) : stds;
    html += STD_GROUPS.map(g => { const list = shown.filter(([s]) => s.grp === g);
      return list.length ? `<h3 class="grp">${g}</h3><div class="grid">${list.map(([s, j]) => card(s, i++, 'std', j)).join('')}</div>` : ''; }).join('');
  }
  const headCard = ([h, j]) => `<button class="card" style="--i:${i++}" data-kind="head" data-id="${j}">
      <img class="thumb" src="${IMG_BASE + h.file}" alt="" loading="lazy"><b>${esc(h.code)}</b><small>${esc(h.desc)}</small></button>`;
  const docs = show('doc') ? DOCS.filter(d => !q || (d.t + d.c).toLowerCase().includes(q)) : [];
  if (cat === 'all' && !q) { // หน้ารวม: หัวเสา + ห้องสมุด ย่อเหลือการ์ดเดียว
    html += `<h2 class="sec">ชุดหัวเสา · ห้องสมุดเอกสาร</h2><div class="grid">
      ${summary(i++, 'goto-head', `<img class="thumb" src="${IMG_BASE}head-dde.png" alt="" loading="lazy">`, `ชุดหัวเสา ${HEADS.length} แบบ`, HEAD_GROUPS.join(' · '))}
      ${summary(i++, 'goto-doc', `<span class="ico">${icon('book')}</span>`, `ห้องสมุดเอกสาร ${DOCS.length} ไฟล์`, DOC_CATS.join(' · '))}</div>`;
  } else if (heads.length) {
    html += `<h2 class="sec">ชุดหัวเสาระบบจำหน่าย</h2>`;
    if (cat === 'head' && !q) html += subtabs('hg', HEAD_GROUPS, hg, g => HEADS.filter(h => h.g === g).length, HEADS.length);
    const shown = cat === 'head' && !q && hg !== 'all' ? heads.filter(([h]) => h.g === hg) : heads;
    html += HEAD_GROUPS.map(g => { const list = shown.filter(([h]) => h.g === g);
      return list.length ? `<h3 class="grp">${g}</h3><div class="grid mini">${list.map(headCard).join('')}</div>` : ''; }).join('');
  }
  if (docs.length && !(cat === 'all' && !q)) {
    html += `<h2 class="sec">ห้องสมุดเอกสาร <small>· เปิดไฟล์ต้นฉบับ${SUPABASE_URL ? '' : 'ใน Google Drive'}</small></h2>`;
    if (cat === 'doc' && !q) html += subtabs('dc', DOC_CATS, dc, c => DOCS.filter(d => d.c === c).length, DOCS.length);
    const shown = cat === 'doc' && !q && dc !== 'all' ? docs.filter(d => d.c === dc) : docs;
    html += DOC_CATS.map(c => { const list = shown.filter(d => d.c === c);
      return list.length ? `<h3 class="grp">${c}</h3><div class="docs">${list.map(d => `<a class="doc" style="--i:${i++}" href="${DOC_URL(d)}" target="_blank" rel="noopener">
        ${icon('book')}<span>${esc(d.t)}</span><small>${d.mb} MB</small></a>`).join('')}</div>` : ''; }).join('');
  }
  $('#list').innerHTML = html || `<p class="empty">ไม่พบ "${esc(q)}"</p>`;
}
function openTool(kind, id) {
  const t = kind === 'calc' ? TOOLS.find(x => x.id === id) : STANDARDS[id];
  $('#dtitle').textContent = t.title;
  if (kind === 'calc') {
    $('#dbody').innerHTML = t.html() + (t.ref ? assyChips(t.ref) : '');
    $('#dbody').oninput = $('#dbody').onchange = e => t.run(e.target.id);
    dlg.showModal(); t.run();
  } else {
    $('#dbody').innerHTML = `<button class="star-toggle" data-star-dlg="${id}"></button><ul class="pts">${t.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>${assyChips(t.ref, t.imgs)}`;
    paintStarBtn(); dlg.showModal();
  }
}
// ติดดาว: กดดาวบนการ์ด หรือปุ่มในหน้ารายละเอียด
function starClicked(idx) {
  toggleStar(STANDARDS[idx]); render(true);
  document.querySelector(`[data-star="${idx}"]`)?.classList.add('pop');
}
function paintStarBtn() {
  const b = document.querySelector('[data-star-dlg]'); if (!b) return;
  const on = isStar(STANDARDS[b.dataset.starDlg]);
  b.setAttribute('aria-pressed', on); b.textContent = on ? '★ ติดดาวแล้ว · กดเพื่อเอาออก' : '☆ ติดดาวไว้ใช้บ่อย';
}
$('#dbody').addEventListener('click', e => { const b = e.target.closest('[data-star-dlg]'); if (b) { starClicked(b.dataset.starDlg); paintStarBtn(); } });
$('#list').addEventListener('keydown', e => { const s = e.target.closest('[data-star]');
  if (s && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); starClicked(s.dataset.star); document.querySelector(`[data-star="${s.dataset.star}"]`)?.focus(); } });
$('#list').onclick = e => {
  const st = e.target.closest('[data-star]'); if (st) { starClicked(st.dataset.star); return; }
  const sub = e.target.closest('[data-hg],[data-sg],[data-dc]');
  if (sub) { ({ hg = hg, sg = sg, dc = dc } = sub.dataset); render(); return; }
  const c = e.target.closest('.card'); if (!c) return;
  const go = t => document.querySelector(`.tab[data-cat="${t}"]`).click();
  if (c.dataset.kind === 'goto-head') return go('head');
  if (c.dataset.kind === 'goto-doc') return go('doc');
  if (c.dataset.kind === 'goto-std') { sg = c.dataset.g; return go('std'); }
  if (c.dataset.kind === 'head') { const h = HEADS[c.dataset.id]; openImg('ชุดหัวเสา ' + h.code, h.file); }
  else openTool(c.dataset.kind, c.dataset.id);
};
$('#q').oninput = render;
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  cat = b.dataset.cat; document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b)); render(); });
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); }); // แตะนอกกรอบเพื่อปิด

// ===== โหลดจาก Supabase (ถ้าตั้งค่าไว้) — ล้มเหลวก็ใช้ข้อมูลในไฟล์ต่อ (ใช้ออฟไลน์หน้างานได้) =====
async function loadDb() {
  if (!SUPABASE_URL) return;
  const get = path => fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } })
    .then(r => r.ok ? r.json() : Promise.reject(r.status));
  try {
    const [c, s, d] = await Promise.all([get('cables?select=name,kg_per_100m&order=sort'),
      get('standards?select=grp,star,title,ref,description,points,imgs&order=sort'), get('docs?select=c,t,id,mb&order=sort')]);
    if (c.length) CABLES = c.map(r => [r.name, +r.kg_per_100m]);
    if (s.length) STANDARDS = s.map(r => ({ grp: r.grp, star: r.star, title: r.title, ref: r.ref, desc: r.description, points: r.points, imgs: r.imgs || [] }));
    if (d.length) DOCS = d;
    $('#foot').textContent += ' · ข้อมูลจาก Supabase';
    render();
  } catch (err) { console.warn('Supabase โหลดไม่ได้ ใช้ข้อมูลในไฟล์แทน', err); }
}
// ===== ลูกเล่นหน้าตา: ตัวเลขสรุป ประกายไฟ แสงตามเมาส์ การ์ดเอียง 3D =====
function decorate() {
  const assyCount = new Set([...STANDARDS, ...TOOLS].flatMap(t => String(t.ref || '').match(/\b\d{4}[A-Z]?\b/g) || [])).size;
  $('#stats').innerHTML = [[TOOLS.length, 'เครื่องคำนวณ'], [STANDARDS.length, 'หัวข้อมาตรฐาน'], [assyCount, 'แบบ Assy'], [HEADS.length, 'ชุดหัวเสา'], [DOCS.length, 'เอกสาร']]
    .map(([n, l]) => `<div class="stat"><b data-n="${n}">0</b><span>${l}</span></div>`).join('');
  setTimeout(() => document.querySelectorAll('.stat b').forEach(b => countTo(b, +b.dataset.n, 0)), 300);
}
$('#sparks').innerHTML = Array.from({ length: 18 }, () =>
  `<i style="left:${Math.random() * 100}%;--s:${(.5 + Math.random()).toFixed(2)};animation-duration:${(6 + Math.random() * 6).toFixed(1)}s;animation-delay:-${(Math.random() * 10).toFixed(1)}s"></i>`).join('');
if (!reduceMotion && matchMedia('(pointer:fine)').matches) {
  const hero = $('#hero');
  hero.addEventListener('pointermove', e => { const r = hero.getBoundingClientRect();
    hero.style.setProperty('--mx', e.clientX - r.left + 'px'); hero.style.setProperty('--my', e.clientY - r.top + 'px'); });
  $('#list').addEventListener('pointermove', e => { const c = e.target.closest('.card'); if (!c) return; const r = c.getBoundingClientRect();
    c.style.setProperty('--ry', (((e.clientX - r.left) / r.width - .5) * 10).toFixed(1) + 'deg');
    c.style.setProperty('--rx', ((.5 - (e.clientY - r.top) / r.height) * 10).toFixed(1) + 'deg'); });
}
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('#q') && !dlg.open) { e.preventDefault(); $('#q').focus(); } });

// ===== เครดิตผู้พัฒนา: ชื่อเด้งขึ้นทีละตัว (ตัดตามตัวอักษรไทย สระ/วรรณยุกต์ไม่หลุด) =====
const DEV = { name: 'นายพชระ ปรีดากรณ์', pos: 'วศก.5 ผปร.กฟส.คช.' };
function openCredit() {
  const chars = window.Intl?.Segmenter ? [...new Intl.Segmenter('th', { granularity: 'grapheme' }).segment(DEV.name)].map(s => s.segment) : [...DEV.name];
  $('#crname').innerHTML = chars.map((c, i) => c === ' ' ? '<span style="--d:' + i + '">&nbsp;</span>' : `<span style="--d:${i}">${esc(c)}</span>`).join('');
  $('#crpos').textContent = DEV.pos;
  $('#cr .cr-card').style.setProperty('--pd', (.9 + chars.length * .06).toFixed(2) + 's'); // ตำแหน่งขึ้นหลังชื่อครบ
  $('#crburst').innerHTML = Array.from({ length: 16 }, (_, i) => `<i style="--a:${i * 22.5}deg;--r:${110 + Math.random() * 60}px"></i>`).join('');
  cr.showModal();
}
cr.addEventListener('click', e => { if (e.target === cr) cr.close(); });

render(); decorate(); loadDb();
</script>
</body>
</html>
